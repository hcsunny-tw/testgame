<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注音探險島 (Học Bopomofo)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 載入「注音芫荽」：國字會直接顯示正確格式的注音 */
        @import url('https://font.emtech.cc/css/BpmfIansui');
        
        body {
            font-family: 'Bpmf Iansui', sans-serif !important;
            /* 超可愛的點點背景 */
            background-color: #fdfaf0;
            background-image: radial-gradient(#fde68a 15%, transparent 15%);
            background-size: 24px 24px;
        }

        .font-zhuyin, .math-word {
            font-family: 'Bpmf Iansui', sans-serif !important;
        }

        body, body * {
            font-family: 'Bpmf Iansui', sans-serif !important;
        }

        /* 3D Ｑ彈卡片與按鈕特效 */
        .btn-3d {
            transition: all 0.15s ease-in-out;
            box-shadow: 0 6px 0 0 rgba(0,0,0,0.1);
        }
        
        .btn-3d:active {
            transform: translateY(6px);
            box-shadow: 0 0 0 0 rgba(0,0,0,0.1);
        }

        .card-3d {
            transition: all 0.2s ease-in-out;
            box-shadow: 0 8px 0 0 #f3f4f6;
        }

        .card-3d:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 0 0 #e5e7eb;
        }

        .card-3d:active {
            transform: translateY(8px);
            box-shadow: 0 0 0 0 #f3f4f6;
        }
        
        .math-card {
            min-height: 160px;
        }

        .math-word {
            font-size: 2.2rem;
            line-height: 1.35;
        }

        @media (min-width: 640px) {
            .math-word {
                font-size: 2.5rem;
            }
        }

        .pulse-animation {
            animation: pulse-soft 2s infinite;
        }

        @keyframes pulse-soft {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .shake {
            animation: shake-animation 0.4s;
        }

        @keyframes shake-animation {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            50% { transform: translateX(8px); }
            75% { transform: translateX(-8px); }
        }

        /* 答對彩帶特效 */
        .confetti-piece {
            position: fixed;
            top: -18px;
            width: 10px;
            height: 16px;
            pointer-events: none;
            z-index: 9999;
            animation: confetti-fall 1.2s ease-out forwards;
        }

        @keyframes confetti-fall {
            0% { transform: translate3d(0, -10px, 0) rotate(0deg); opacity: 1; }
            100% { transform: translate3d(var(--drift), 105vh, 0) rotate(var(--spin)); opacity: 0; }
        }

        /* 最新按鈕與鎖定樣式 */
        .challenge-main-btn {
            display:block; margin:8px auto 22px; padding:14px 24px; border:0; border-radius:999px;
            background:#fde68a; box-shadow:0 6px 0 #facc15; font-size:1.08rem; font-weight:900; cursor:pointer;
        }
        .challenge-main-btn:active {
            transform:translateY(4px); box-shadow:0 2px 0 #facc15;
        }
        .adventure-lock-button {
            margin-top:10px; border:0; border-radius:999px; padding:11px 18px;
            background:#eef1f5; color:#667085; font-weight:900; cursor:not-allowed;
        }
        .adventure-locked-note {
            max-width:720px; margin:0 auto; padding:16px 18px; border-radius:18px;
            background:#f8fafc; border:2px dashed #d8dee8; text-align:center; color:#667085;
            display:flex; flex-direction:column; align-items:center; gap:4px;
        }
        .adventure-locked-note span { font-size:1.6rem; }
        .adventure-locked-note b { font-size:1rem; }
        .adventure-locked-note small { opacity:.8; }
    </style>
</head>
<body class="min-h-screen text-gray-800 p-4 sm:p-8 font-sans">
    <div id="app" class="max-w-5xl mx-auto pb-10">
        
        <!-- 可愛標題區 -->
        <header class="text-center mb-8 bg-white/80 rounded-3xl py-6 shadow-sm border-4 border-white backdrop-blur-sm">
            <h1 class="text-4xl sm:text-5xl text-[#4A5568] font-bold mb-3 tracking-wide">
                🌟 注音探險島 🌟
            </h1>
            <h2 class="text-xl sm:text-2xl text-gray-500 font-bold bg-yellow-100 inline-block px-6 py-2 rounded-full shadow-sm">
                Học Bopomofo Cùng Nhau
            </h2>
        </header>

        <!-- 模式切換按鈕 -->
        <nav class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-4 sm:gap-6 mb-10 font-sans">
            <button onclick="switchMode('consonants')" id="btn-consonants" class="nav-btn btn-3d bg-blue-100 text-blue-700 py-4 sm:py-5 rounded-[2rem] text-xl font-black border-4 border-white">
                聲母 (Phụ âm)
            </button>
            <button onclick="switchMode('song')" id="btn-song" class="nav-btn btn-3d bg-pink-100 text-pink-700 py-4 sm:py-5 flex items-center justify-center rounded-[2rem] text-xl font-black border-4 border-white">
                🎵 注音歌
            </button>
            <button onclick="switchMode('phrases')" id="btn-phrases" class="nav-btn btn-3d bg-purple-100 text-purple-700 py-4 sm:py-5 rounded-[2rem] text-xl font-black border-4 border-white">
                生活用語
            </button>
            <button onclick="switchMode('game')" id="btn-game" class="nav-btn btn-3d bg-yellow-300 text-yellow-800 py-4 sm:py-5 rounded-[2rem] text-xl font-black border-4 border-white flex items-center justify-center gap-2">
                🎮 聽音選擇
            </button>
            <button onclick="switchMode('math')" id="btn-math" class="nav-btn btn-3d bg-green-100 text-green-700 py-4 sm:py-5 rounded-[2rem] text-xl font-black border-4 border-white flex items-center justify-center gap-2">
                📚 數學小教室
            </button>
            <button onclick="switchMode('math-listening')" id="btn-math-listening" class="nav-btn btn-3d bg-orange-100 text-orange-700 py-4 sm:py-5 rounded-[2rem] text-xl font-black border-4 border-white flex items-center justify-center gap-2">
                🎧 數字聽力
            </button>
            <button onclick="switchMode('math-adventure')" id="btn-math-adventure" class="nav-btn btn-3d bg-teal-100 text-teal-700 py-4 sm:py-5 rounded-[2rem] text-xl font-black border-4 border-white flex items-center justify-center gap-2">
                🏝️ 語詞冒險
            </button>
        </nav>

        <!-- 內容顯示區 -->
        <main id="main-content" class="min-h-[50vh]">
            <!-- 動態內容會注入這裡 -->
        </main>
        
        <!-- 專屬頁尾 -->
        <footer class="mt-16 text-center text-gray-400/80 font-bold font-sans tracking-widest text-sm sm:text-base">
            ✨ 筱晴老師製作 ✨
        </footer>
    </div>

    <script>
        // 數學語詞資料庫
        const mathData = [
            { category: '🔢 數字', items: [
                { chinese: '一', zhuyin: ['ㄧ'], tone: 'ˊ', vn: 'một', emoji: '1️⃣' },
                { chinese: '二', zhuyin: ['ㄦ'], tone: 'ˋ', vn: 'hai', emoji: '2️⃣' },
                { chinese: '三', zhuyin: ['ㄙ', 'ㄢ'], tone: 'ˉ', vn: 'ba', emoji: '3️⃣' },
                { chinese: '四', zhuyin: ['ㄙ', 'ˋ'], tone: 'ˋ', vn: 'bốn', emoji: '4️⃣' },
                { chinese: '五', zhuyin: ['ㄨ'], tone: 'ˇ', vn: 'năm', emoji: '5️⃣' },
                { chinese: '六', zhuyin: ['ㄌ', 'ㄧ', 'ㄡ'], tone: 'ˋ', vn: 'sáu', emoji: '6️⃣' },
                { chinese: '七', zhuyin: ['ㄑ', 'ㄧ'], tone: 'ˉ', vn: 'bảy', emoji: '7️⃣' },
                { chinese: '八', zhuyin: ['ㄅ', 'ㄚ'], tone: 'ˉ', vn: 'tám', emoji: '8️⃣' },
                { chinese: '九', zhuyin: ['ㄐ', 'ㄧ', 'ㄡ'], tone: 'ˇ', vn: 'chín', emoji: '9️⃣' },
                { chinese: '十', zhuyin: ['ㄕ'], tone: 'ˊ', vn: 'mười', emoji: '🔟' },
                { chinese: '二十', zhuyin: ['ㄦ', 'ㄕ'], tone: 'ˋ', vn: 'hai mươi' },
                { chinese: '三十', zhuyin: ['ㄙ', 'ㄢ', 'ㄕ'], tone: 'ˉ', vn: 'ba mươi' }
            ]},
            { category: '🔟 位值', items: [
                { chinese: '個位', zhuyin: ['ㄍ', 'ㄜ'], tone: 'ˋ', vn: 'hàng đơn vị', example: '最右邊的數字' },
                { chinese: '十位', zhuyin: ['ㄕ', 'ㄨ'], tone: 'ˊ', vn: 'hàng chục' },
                { chinese: '百位', zhuyin: ['ㄅ', 'ㄞ'], tone: 'ˇ', vn: 'hàng trăm' }
            ]},
            { category: '➕ 加減', items: [
                { chinese: '加', zhuyin: ['ㄐ', 'ㄧ', 'ㄚ'], tone: 'ˉ', vn: 'cộng', emoji: '➕', example: '3 ＋ 2 ＝ 5' },
                { chinese: '減', zhuyin: ['ㄐ', 'ㄧ', 'ㄢ'], tone: 'ˇ', vn: 'trừ', emoji: '➖', example: '5 － 1 ＝ 4' },
                { chinese: '等於', zhuyin: ['ㄉ', 'ㄥ', 'ㄩ'], tone: 'ˇ', vn: 'bằng', emoji: '🟰', example: '1 ＋ 1 ＝ 2' }
            ]},
            { category: '📏 長短厚薄', items: [
                { chinese: '長', zhuyin: ['ㄔ', 'ㄤ'], tone: 'ˊ', vn: 'dài', emoji: '📏', example: '這條線比較長。' },
                { chinese: '短', zhuyin: ['ㄉ', 'ㄨ', 'ㄢ'], tone: 'ˇ', vn: 'ngắn', emoji: '🖍️', example: '這支筆比較短。' },
                { chinese: '厚', zhuyin: ['ㄏ', 'ㄡ'], tone: 'ˋ', vn: 'dày', emoji: '📚', example: '這本書很厚。' },
                { chinese: '薄', zhuyin: ['ㄅ', 'ㄛ'], tone: 'ˊ', vn: 'mỏng', emoji: '📄', example: '這張紙很薄。' }
            ]},
            { category: '📐 線', items: [
                { chinese: '曲線', zhuyin: ['ㄑ', 'ㄩ', 'ㄒ', 'ㄧ', 'ㄢ'], tone: 'ˉ', vn: 'đường cong', emoji: '〰️', example: '彎彎曲曲的線。' },
                { chinese: '直線', zhuyin: ['ㄓ', 'ㄓ', 'ㄒ', 'ㄧ', 'ㄢ'], tone: 'ˊ', vn: 'đường thẳng', emoji: '📏', example: '直直的線。' }
            ]}
        ];

        const zhuyinData = {
            consonants: [
                { symbol: 'ㄉ', vn: 'd (đ)', type: 'consonant' },
                { symbol: 'ㄊ', vn: 't (th)', type: 'consonant' },
                { symbol: 'ㄋ', vn: 'n', type: 'consonant' },
                { symbol: 'ㄌ', vn: 'l', type: 'consonant' },
                { symbol: 'ㄍ', vn: 'g', type: 'consonant' },
                { symbol: 'ㄎ', vn: 'k (kh)', type: 'consonant' },
                { symbol: 'ㄏ', vn: 'h', type: 'consonant' },
                { symbol: 'ㄐ', vn: 'j (gi/ch)', type: 'consonant' },
                { symbol: 'ㄑ', vn: 'q (ch)', type: 'consonant' },
                { symbol: 'ㄒ', vn: 'x (x)', type: 'consonant' },
                { symbol: 'ㄓ', vn: 'zh (tr)', type: 'consonant' },
                { symbol: 'ㄔ', vn: 'ch (tr nặng)', type: 'consonant' },
                { symbol: 'ㄕ', vn: 'sh (s)', type: 'consonant' },
                { symbol: 'ㄖ', vn: 'r', type: 'consonant' },
                { symbol: 'ㄗ', vn: 'z (ch nhẹ)', type: 'consonant' },
                { symbol: 'ㄘ', vn: 'c (x nhẹ)', type: 'consonant' },
                { symbol: 'ㄙ', vn: 's (s nhẹ)', type: 'consonant' }
            ]
        };

        const phrasesData = [
            { chinese: [{ char: '你', zhuyin: ['ㄋ', 'ㄧ'], tone: 'ˇ' }, { char: '好', zhuyin: ['ㄏ', 'ㄠ'], tone: 'ˇ' }], vn: 'Xin chào', emoji: '👋' },
            { chinese: [{ char: '謝', zhuyin: ['ㄒ', 'ㄧ', 'ㄝ'], tone: 'ˋ' }, { char: '謝', zhuyin: ['ㄒ', 'ㄧ', 'ㄝ'], tone: '˙' }], vn: 'Cảm ơn', emoji: '🙏' },
            { chinese: [{ char: '對', zhuyin: ['ㄉ', 'ㄨ', 'ㄟ'], tone: 'ˋ' }, { char: '不', zhuyin: ['ㄅ', 'ㄨ'], tone: 'ˋ' }, { char: '起', zhuyin: ['ㄑ', 'ㄧ'], tone: 'ˇ' }], vn: 'Xin lỗi', emoji: '🙇' },
            { chinese: [{ char: '再', zhuyin: ['ㄗ', 'ㄞ'], tone: 'ˋ' }, { char: '見', zhuyin: ['ㄐ', 'ㄧ', 'ㄢ'], tone: 'ˋ' }], vn: 'Tạm biệt', emoji: '👋' },
            { chinese: [{ char: '老', zhuyin: ['ㄌ', 'ㄠ'], tone: 'ˇ' }, { char: '師', zhuyin: ['ㄕ'], tone: '' }, { char: '好', zhuyin: ['ㄏ', 'ㄠ'], tone: 'ˇ' }], vn: 'Em chào cô/thầy', emoji: '👩‍🏫' },
            { chinese: [{ char: '聯', zhuyin: ['ㄌ', 'ㄧ', 'ㄢ'], tone: 'ˊ' }, { char: '絡', zhuyin: ['ㄌ', 'ㄨ', 'ㄛ'], tone: 'ˋ' }, { char: '簿', zhuyin: ['ㄅ', 'ㄨ'], tone: 'ˋ' }], vn: 'Sổ liên lạc', emoji: '📒' },
            { chinese: [{ char: '好', zhuyin: ['ㄏ', 'ㄠ'], tone: 'ˇ' }, { char: '朋', zhuyin: ['ㄆ', 'ㄥ'], tone: 'ˊ' }, { char: '友', zhuyin: ['ㄧ', 'ㄡ'], tone: 'ˇ' }], vn: 'Bạn tốt', emoji: '🤝' },
            { chinese: [{ char: '好', zhuyin: ['ㄏ', 'ㄠ'], tone: 'ˇ' }], vn: 'Tốt / Được', emoji: '👍' },
            { chinese: [{ char: '不', zhuyin: ['ㄅ', 'ㄨ'], tone: 'ˋ' }], vn: 'Không', emoji: '🙅' },
            { chinese: [{ char: '上', zhuyin: ['ㄕ', 'ㄤ'], tone: 'ˋ' }, { char: '廁', zhuyin: ['ㄘ', 'ㄜ'], tone: 'ˋ' }, { char: '所', zhuyin: ['ㄙ', 'ㄨ', 'ㄛ'], tone: 'ˇ' }], vn: 'Đi vệ sinh', emoji: '🚽' },
            { chinese: [{ char: '喝', zhuyin: ['ㄏ', 'ㄜ'], tone: '' }, { char: '水', zhuyin: ['ㄕ', 'ㄨ', 'ㄟ'], tone: 'ˇ' }], vn: 'Uống nước', emoji: '💧' },
            { chinese: [{ char: '早', zhuyin: ['ㄗ', 'ㄠ'], tone: 'ˇ' }, { char: '安', zhuyin: ['ㄢ'], tone: '' }], vn: 'Chào buổi sáng', emoji: '🌅' },
            { chinese: [{ char: '午', zhuyin: ['ㄨ'], tone: 'ˇ' }, { char: '安', zhuyin: ['ㄢ'], tone: '' }], vn: 'Chào buổi trưa', emoji: '☀️' },
            { chinese: [{ char: '晚', zhuyin: ['ㄨ', 'ㄢ'], tone: 'ˇ' }, { char: '安', zhuyin: ['ㄢ'], tone: '' }], vn: 'Chúc ngủ ngon', emoji: '🌙' },
            { chinese: [{ char: '聽', zhuyin: ['ㄊ', 'ㄧ', 'ㄥ'], tone: '' }, { char: '不', zhuyin: ['ㄅ', 'ㄨ'], tone: 'ˋ' }, { char: '懂', zhuyin: ['ㄉ', 'ㄨ', 'ㄥ'], tone: 'ˇ' }], vn: 'Không hiểu', emoji: '❓' }
        ];

        let currentMode = 'consonants';
        const allSymbols = [...zhuyinData.consonants];
        const allMathWords = mathData.flatMap(group => group.items);
        const mathChallengeWords = ['一','二','三','十','二十','個位','十位','百位','加','減','等於','長','短','厚','薄','曲線','直線'];
        
        let listeningStarted = false;
        let listeningIndex = 0;
        let listeningTarget = '';
        let listeningScore = 0;

        // 語音修正：利用同音字讓 TTS 發出正確的讀音
        const speechTextMap = { 
            '薄': '博',
            '曲線': '區線'
        };
        let zhVoices = [];

        function loadVoices() {
            if (!('speechSynthesis' in window)) return;
            zhVoices = window.speechSynthesis.getVoices().filter(v => /^zh(-|_|$)/i.test(v.lang));
        }
        loadVoices();
        if ('speechSynthesis' in window && 'onvoiceschanged' in window.speechSynthesis) {
            window.speechSynthesis.onvoiceschanged = loadVoices;
        }

        function chooseChineseVoice() {
            if (!zhVoices.length) loadVoices();
            const preferred = [
                /Microsoft.*Yunxi/i, /Microsoft.*Xiaoxiao/i, /Microsoft.*Yunjian/i,
                /Microsoft.*HsiaoChen/i, /Microsoft.*HsiaoYu/i, /Microsoft.*Yating/i,
                /Google.*繁體中文/i, /Google.*Taiwan/i, /Sinji/i
            ];
            for (const pattern of preferred) {
                const found = zhVoices.find(v => pattern.test(v.name) && /zh-TW|zh-Hant|zh-HK/i.test(v.lang));
                if (found) return found;
            }
            return zhVoices.find(v => /zh-TW|zh-Hant/i.test(v.lang)) || zhVoices[0] || null;
        }

        function playSound(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(speechTextMap[text] || text);
                utterance.lang = 'zh-TW';
                const voice = chooseChineseVoice();
                if (voice) utterance.voice = voice;
                utterance.rate = 0.9;
                utterance.pitch = 1.05;
                utterance.volume = 1;
                window.speechSynthesis.speak(utterance);
            }
        }

        function showConfetti() {
            const pieces = 42;
            for (let i = 0; i < pieces; i++) {
                const el = document.createElement('span');
                el.className = 'confetti-piece';
                el.style.left = `${Math.random() * 100}vw`;
                el.style.setProperty('--drift', `${(Math.random() - 0.5) * 220}px`);
                el.style.setProperty('--spin', `${Math.random() * 720 - 360}deg`);
                el.style.animationDelay = `${Math.random() * 180}ms`;
                el.style.width = `${7 + Math.random() * 7}px`;
                el.style.height = `${10 + Math.random() * 10}px`;
                el.style.background = ['#f43f5e','#f59e0b','#22c55e','#3b82f6','#a855f7'][Math.floor(Math.random()*5)];
                document.body.appendChild(el);
                setTimeout(() => el.remove(), 1600);
            }
        }

        function celebrateCorrect() {
            showConfetti();
            playSound('正確');
        }

        function switchMode(mode) {
            currentMode = mode;
            
            // 更新按鈕樣式
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.remove('shadow-[0_0_0_0_rgba(0,0,0,0.1)]', 'translate-y-[6px]');
            });
            
            const activeBtn = document.getElementById(`btn-${mode}`);
            if(activeBtn) {
                activeBtn.classList.add('shadow-[0_0_0_0_rgba(0,0,0,0.1)]', 'translate-y-[6px]');
            }

            renderContent();
            applySiteIVS();
        }

        function toSiteIVS(text) {
            let res = text.replaceAll('謝謝', '謝\u{E01E0}謝\u{E01E1}');
            // 字型顯示修正：利用 IVS 強制讓「曲」顯示第一聲 (ㄑㄩ)
            res = res.replaceAll('曲線', '曲\u{E01E0}線');
            return res;
        }

        function applySiteIVS() {
            const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
            const nodes = [];
            while (walker.nextNode()) nodes.push(walker.currentNode);
            nodes.forEach(node => {
                const parent = node.parentElement;
                if (!parent || parent.closest('script, style, textarea, iframe')) return;
                const converted = toSiteIVS(node.nodeValue);
                if (converted !== node.nodeValue) node.nodeValue = converted;
            });
        }

        function renderContent() {
            const mainContent = document.getElementById('main-content');
            mainContent.innerHTML = ''; // 清空

            if (currentMode === 'consonants') {
                renderConsonants(mainContent);
            } 
            else if (currentMode === 'phrases') {
                renderPhrases(mainContent);
            }
            else if (currentMode === 'math') {
                renderMathClassroom(mainContent);
            }
            else if (currentMode === 'song') {
                renderBopomofoSong(mainContent);
            }
            else if (currentMode === 'game') {
                initGame(mainContent);
            }
            else if (currentMode === 'math-listening') {
                renderMathListening(mainContent);
            }
            else if (currentMode === 'math-adventure') {
                renderMathAdventure(mainContent);
            }
        }

        function renderConsonants(container) {
            const grid = document.createElement('div');
            grid.className = 'grid grid-cols-2 sm:grid-cols-4 md:grid-cols-5 gap-4 sm:gap-6 pb-6';
            zhuyinData.consonants.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card-3d bg-white rounded-[2rem] p-6 sm:p-8 flex flex-col items-center justify-center cursor-pointer border-4 border-white';
                const textColor = item.type === 'consonant' ? 'text-blue-500' : 'text-green-500';
                const bgColor = item.type === 'consonant' ? 'bg-blue-50' : 'bg-green-50';
                card.innerHTML = `
                    <div class="font-zhuyin text-5xl sm:text-6xl mb-4 ${textColor}">${item.symbol}</div>
                    <div class="text-lg sm:text-xl text-gray-500 font-bold font-sans bg-gray-100 px-5 py-1.5 rounded-full">${item.vn}</div>
                `;
                card.onclick = () => {
                    card.classList.add(bgColor);
                    setTimeout(() => card.classList.remove(bgColor), 200);
                    playSound(item.symbol);
                };
                grid.appendChild(card);
            });
            container.appendChild(grid);
        }

        function renderPhrases(container) {
            const grid = document.createElement('div');
            grid.className = 'grid grid-cols-1 md:grid-cols-2 gap-4 sm:gap-6 pb-6';
            phrasesData.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card-3d bg-white rounded-[1.5rem] p-3 sm:p-4 flex flex-col sm:flex-row items-center justify-between cursor-pointer border-4 border-white';
                const plainChineseText = item.chinese.map(c => c.char).join('');
                const ivsChineseText = toSiteIVS(plainChineseText);
                card.innerHTML = `
                    <div class="flex items-center gap-3 sm:gap-4 mb-3 sm:mb-0 w-full">
                        <div class="text-3xl sm:text-4xl bg-purple-50 p-2.5 rounded-2xl shrink-0">${item.emoji}</div>
                        <div class="text-center sm:text-left flex-1">
                            <div class="mb-3 flex flex-wrap justify-center sm:justify-start items-center">
                                <span class="font-zhuyin text-3xl sm:text-4xl font-black text-gray-700 tracking-wide">${ivsChineseText}</span>
                            </div>
                            <div class="text-sm sm:text-base text-gray-500 font-bold font-sans mt-1 bg-gray-100 inline-block px-3 py-0.5 rounded-full">${item.vn}</div>
                        </div>
                    </div>
                    <button class="w-12 h-12 rounded-full bg-purple-100 text-purple-600 flex items-center justify-center text-xl shrink-0 border-4 border-white shadow-sm">🔊</button>
                `;
                card.onclick = () => {
                    card.classList.add('bg-purple-50');
                    setTimeout(() => card.classList.remove('bg-purple-50'), 200);
                    playSound(plainChineseText);
                };
                grid.appendChild(card);
            });
            container.appendChild(grid);
        }

        function renderMathClassroom(container) {
            mathData.forEach(group => {
                const section = document.createElement('section');
                section.className = 'mb-8';
                section.innerHTML = `<h3 class="text-2xl sm:text-3xl font-black text-gray-700 mb-5 text-center">${group.category}</h3>`;
                const grid = document.createElement('div');
                grid.className = 'grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4 sm:gap-5';
                group.items.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'card-3d math-card bg-white rounded-[1.5rem] p-4 sm:p-5 flex flex-col items-center justify-start cursor-pointer border-4 border-white text-center h-full';
                    
                    let emojiHtml = item.emoji ? `<div class="text-3xl sm:text-4xl mb-2">${item.emoji}</div>` : '';
                    let exampleHtml = item.example ? `<div class="w-full bg-yellow-50 text-yellow-800 text-sm sm:text-base font-bold p-2 rounded-xl mb-3 border-2 border-yellow-100 font-sans text-left px-3">${item.example}</div>` : '';
                    
                    card.innerHTML = `
                        ${emojiHtml}
                        <div class="math-word font-black text-green-600 mb-2 leading-tight">${item.chinese}</div>
                        <div class="text-sm sm:text-base text-green-700 font-bold bg-green-50 px-3 py-1 rounded-full mb-4">${item.vn}</div>
                        ${exampleHtml}
                        <button class="mt-auto flex items-center justify-center gap-1.5 w-full bg-gray-50 hover:bg-gray-100 text-gray-600 font-bold py-2 rounded-xl transition-colors text-sm sm:text-base border-2 border-gray-100">
                            🔊 聽一聽
                        </button>
                    `;
                    card.onclick = () => { 
                        card.classList.add('bg-green-50'); 
                        setTimeout(()=>card.classList.remove('bg-green-50'),200); 
                        playSound(item.chinese); 
                    };
                    grid.appendChild(card);
                });
                section.appendChild(grid); 
                container.appendChild(section);
            });
        }

        function renderMathListening(container) {
            container.innerHTML = `
                <div class="max-w-3xl mx-auto bg-white rounded-[2.5rem] p-6 sm:p-8 border-4 border-white shadow-[0_12px_0_0_#f3f4f6] text-center">
                    <div class="text-center mb-6">
                        <div class="text-5xl mb-3">🎧</div>
                        <h2 class="text-2xl sm:text-3xl font-black text-gray-700">數字聽力挑戰</h2>
                        <p class="text-gray-500 font-bold mt-2">按下開始按鈕後，才會開始挑戰。</p>
                    </div>
                    <div id="listen-start-area">
                        <button class="challenge-main-btn" id="listen-start-btn">🎧 開始數字聽力挑戰</button>
                    </div>
                    <div id="listen-game" style="display:none">
                        <div class="flex justify-between font-black opacity-70 mb-4 px-4 text-lg">
                            <span id="listen-round">第 1 題</span>
                            <span id="listen-score">⭐ 0</span>
                        </div>
                        <button class="pulse-animation mx-auto w-28 h-28 bg-yellow-300 hover:bg-yellow-400 rounded-full flex items-center justify-center text-5xl border-4 border-white shadow-[0_8px_0_0_#fde047] active:translate-y-2 active:shadow-none transition-all mb-8" id="listen-play-btn">🔊</button>
                        <div id="listen-choices" class="grid grid-cols-1 sm:grid-cols-3 gap-4"></div>
                        <div id="listen-feedback" class="mt-7 text-2xl font-black h-10"></div>
                    </div>
                </div>
            `;
            
            document.getElementById('listen-start-btn').onclick = () => {
                listeningStarted = true; 
                listeningIndex = 0;
                listeningScore = 0;
                document.getElementById('listen-start-area').style.display = 'none';
                document.getElementById('listen-game').style.display = 'block';
                nextListeningQuestion();
            };
            document.getElementById('listen-play-btn').onclick = () => playSound(listeningTarget);
        }

        function nextListeningQuestion() {
            const round = document.getElementById('listen-round');
            const scoreLabel = document.getElementById('listen-score');
            const choices = document.getElementById('listen-choices');
            const feedback = document.getElementById('listen-feedback');
            
            if(!round || !choices) return;
            
            listeningTarget = mathChallengeWords[Math.floor(Math.random() * mathChallengeWords.length)];
            let pool = [listeningTarget];
            while(pool.length < 3) {
                const x = mathChallengeWords[Math.floor(Math.random() * mathChallengeWords.length)];
                if(!pool.includes(x)) pool.push(x);
            }
            pool.sort(() => Math.random() - 0.5);
            
            round.textContent = `第 ${listeningIndex + 1} 題`;
            scoreLabel.textContent = `⭐ ${listeningScore}`;
            feedback.innerHTML = '';
            
            choices.innerHTML = pool.map(x => `
                <button class="feature-choice btn-3d bg-gray-50 hover:bg-green-50 border-4 border-gray-100 hover:border-green-300 rounded-[1.5rem] p-5 text-2xl sm:text-3xl font-black transition-all" data-word="${x}">
                    ${x}
                </button>
            `).join('');
            
            choices.querySelectorAll('button').forEach(btn => {
                btn.onclick = () => {
                    if(btn.dataset.word === listeningTarget) {
                        btn.classList.replace('bg-gray-50', 'bg-green-400');
                        btn.classList.replace('border-gray-100', 'border-green-400');
                        btn.classList.add('text-white');
                        feedback.innerHTML = '<span class="text-green-500 bg-green-100 px-5 py-2 rounded-full">✨ 正確！ ✨</span>';
                        celebrateCorrect();
                        listeningScore++;
                        
                        setTimeout(() => {
                            listeningIndex++;
                            if(listeningIndex >= 5) {
                                feedback.innerHTML = '<span class="text-blue-500 bg-blue-100 px-5 py-2 rounded-full">🏆 挑戰完成！</span>';
                                return;
                            }
                            nextListeningQuestion();
                        }, 1300);
                    } else {
                        btn.classList.replace('bg-gray-50', 'bg-red-100');
                        btn.classList.replace('border-gray-100', 'border-red-300');
                        btn.classList.add('shake');
                        feedback.innerHTML = '<span class="text-red-500 bg-red-100 px-5 py-2 rounded-full">❌ 再試一次！</span>';
                        playSound('不對喔');
                        setTimeout(() => btn.classList.remove('shake'), 500);
                    }
                };
            });
            
            setTimeout(() => playSound(listeningTarget), 300);
        }

        function renderMathAdventure(container) {
            container.innerHTML = `
                <div class="max-w-3xl mx-auto bg-white rounded-[2.5rem] p-6 sm:p-10 border-4 border-white shadow-[0_12px_0_0_#f3f4f6] text-center">
                    <div class="text-center mb-6">
                        <div class="text-5xl mb-4">🏝️</div>
                        <h2 class="text-2xl sm:text-3xl font-black text-gray-700">語詞冒險</h2>
                        <p class="text-gray-500 font-bold mt-2">目前暫不開放，等大家熟悉數學語詞後再一起挑戰！</p>
                    </div>
                    <div class="adventure-locked-note mx-auto mt-6">
                        <span>🌱</span>
                        <b>目前先專心學習數學語詞與聽力挑戰</b>
                        <small>冒險模式之後會開放 5 個關卡。</small>
                    </div>
                    <button class="adventure-lock-button mx-auto mt-8 block w-full sm:w-auto" disabled>🔒 語詞冒險尚未開放</button>
                </div>
            `;
        }

        function renderBopomofoSong(container) {
            container.innerHTML = `
                <section class="max-w-4xl mx-auto bg-white rounded-[2.5rem] p-4 sm:p-6 border-4 border-white shadow-[0_12px_0_0_#f3f4f6]">
                    <div class="text-center mb-4">
                        <h3 class="text-3xl sm:text-4xl font-black text-pink-600 mb-2">🎵 注音歌</h3>
                        <p class="text-gray-500 font-bold">直接在網站裡觀看，不需要跳到其他影片。</p>
                    </div>
                    <div class="relative w-full overflow-hidden rounded-[1.75rem] bg-black aspect-video">
                        <iframe
                            id="bopomofo-youtube"
                            class="absolute inset-0 w-full h-full"
                            title="注音歌"
                            loading="lazy"
                            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                            referrerpolicy="origin-when-cross-origin"
                            allowfullscreen>
                        </iframe>
                    </div>
                    <p id="youtube-debug" class="text-center text-sm text-gray-400 mt-4 font-bold">影片由 YouTube 播放器內嵌於本頁。</p>
                </section>`;
            
            const iframe = document.getElementById('bopomofo-youtube');
            if (!iframe) return;
            const params = new URLSearchParams({
                rel: '0', playsinline: '1', enablejsapi: '1',
                origin: window.location.origin === 'null' ? '' : window.location.origin
            });
            if (window.location.protocol === 'file:') params.delete('origin');
            iframe.src = 'https://www.youtube-nocookie.com/embed/S-H3WJNbf0A?' + params.toString();
        }

        function initGame(container) {
            container.innerHTML = `
                <div class="max-w-3xl mx-auto bg-white rounded-[3rem] p-8 sm:p-12 border-4 border-white shadow-[0_12px_0_0_#f3f4f6] text-center">
                    <h3 class="text-3xl font-black text-gray-700 mb-3 font-sans">Nghe và Chọn (聽音選擇)</h3>
                    <p class="text-gray-500 text-lg mb-8 font-bold font-sans">Hãy nghe âm thanh và chọn chữ cái đúng</p>
                    <button id="play-sound-btn" class="pulse-animation mx-auto w-28 h-28 sm:w-36 sm:h-36 bg-yellow-300 hover:bg-yellow-400 rounded-full flex items-center justify-center text-5xl sm:text-6xl border-4 border-white shadow-[0_8px_0_0_#fde047] active:translate-y-2 active:shadow-none transition-all mb-12">🔊</button>
                    <div id="options-container" class="grid grid-cols-3 gap-4 sm:gap-8"></div>
                    <div id="game-feedback" class="mt-10 text-3xl font-black h-12 flex items-center justify-center"></div>
                </div>
            `;
            startNewGameRound();
        }

        function startNewGameRound() {
            const optionsContainer = document.getElementById('options-container');
            const playSoundBtn = document.getElementById('play-sound-btn');
            const feedback = document.getElementById('game-feedback');
            
            if(!optionsContainer || !playSoundBtn) return;
            feedback.innerHTML = ''; 
            optionsContainer.innerHTML = ''; 

            let shuffled = [...allSymbols].sort(() => 0.5 - Math.random());
            let choices = shuffled.slice(0, 3);
            let target = choices[Math.floor(Math.random() * 3)];

            playSoundBtn.onclick = () => playSound(target.symbol);
            setTimeout(() => playSound(target.symbol), 600);

            choices.forEach(item => {
                const btn = document.createElement('button');
                btn.className = 'font-zhuyin btn-3d bg-gray-50 hover:bg-yellow-50 border-4 border-gray-100 hover:border-yellow-300 rounded-[2rem] py-8 sm:py-10 text-5xl sm:text-6xl font-bold transition-all';
                btn.innerText = item.symbol;
                
                btn.onclick = () => {
                    if (item.symbol === target.symbol) {
                        btn.classList.replace('bg-gray-50', 'bg-green-400');
                        btn.classList.replace('border-gray-100', 'border-green-400');
                        btn.classList.add('text-white', 'scale-105');
                        feedback.innerHTML = '<span class="text-green-500 bg-green-100 px-6 py-2 rounded-full">✨ 正確！ (Đúng rồi!) ✨</span>';
                        celebrateCorrect();
                        setTimeout(startNewGameRound, 1500);
                    } else {
                        btn.classList.replace('bg-gray-50', 'bg-red-100');
                        btn.classList.replace('border-gray-100', 'border-red-300');
                        btn.classList.add('shake');
                        feedback.innerHTML = '<span class="text-red-500 bg-red-100 px-6 py-2 rounded-full">❌ 再試一次 (Thử lại nhé)</span>';
                        playSound('不對喔');
                        setTimeout(() => btn.classList.remove('shake'), 500);
                    }
                };
                optionsContainer.appendChild(btn);
            });
        }

        window.onload = () => {
            applySiteIVS();
            switchMode('consonants');
        };
    </script>
</body>
</html>
